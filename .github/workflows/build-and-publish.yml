name: Build, Verify & Publish IntelliJ Plugin

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Validate Release Tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew checkReleaseTag --no-daemon

      - name: Test, Build, and Verify Plugin
        run: ./gradlew test buildPlugin verifyPlugin --no-daemon

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: syrobin-java-code-generate-plugin
          path: build/distributions/*.zip

      - name: Publish to JetBrains Marketplace (On Release Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin --no-daemon
