<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- 主背景渐变：深邃科技蓝紫 -> 青翠渐变 -->
        <linearGradient id="bgGrad" x1="3" y1="3" x2="37" y2="37" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#4F46E5"/>
            <stop offset="52%" stop-color="#0284C7"/>
            <stop offset="100%" stop-color="#10B981"/>
        </linearGradient>
        <!-- 数据库金属光泽渐变 -->
        <linearGradient id="dbGrad" x1="8" y1="10" x2="21" y2="30" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#BAE6FD"/>
        </linearGradient>
        <!-- 闪电能量渐变：琥珀金 -> 亮黄 -->
        <linearGradient id="boltGrad" x1="18" y1="11" x2="26" y2="29" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FDE047"/>
            <stop offset="100%" stop-color="#F97316"/>
        </linearGradient>
    </defs>

    <!-- 外层圆角矩形底座（留出 3px 安全边距符合 JetBrains 规范） -->
    <rect x="3" y="3" width="34" height="34" rx="8.5" fill="url(#bgGrad)"/>
    <rect x="3.5" y="3.5" width="33" height="33" rx="8" stroke="#FFFFFF" stroke-opacity="0.24"/>

    <!-- 左侧：数据库多层圆柱体 (象征多方言数据库 / DDL 数据源) -->
    <ellipse cx="14.5" cy="13" rx="6" ry="2.4" fill="url(#dbGrad)"/>
    <path d="M8.5 13V18.2C8.5 19.53 11.19 20.6 14.5 20.6C17.81 20.6 20.5 19.53 20.5 18.2V13C20.5 14.33 17.81 15.4 14.5 15.4C11.19 15.4 8.5 14.33 8.5 13Z" fill="url(#dbGrad)" fill-opacity="0.92"/>
    <path d="M8.5 19.8V25C8.5 26.33 11.19 27.4 14.5 27.4C17.81 27.4 20.5 26.33 20.5 25V19.8C20.5 21.13 17.81 22.2 14.5 22.2C11.19 22.2 8.5 21.13 8.5 19.8Z" fill="url(#dbGrad)" fill-opacity="0.82"/>

    <!-- 右侧：Java 代码花括号/尖括号 (象征自动生成 Java 源码) -->
    <path d="M26.5 13.5L31.5 18.5L26.5 23.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M25.5 27.5H31.5" stroke="#A7F3D0" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 核心视觉焦点：自动化代码生成闪电徽标 -->
    <path d="M22.8 10.5L17.2 20.2H21.6L19.8 29.5L26.8 18.8H22.1L22.8 10.5Z" fill="url(#boltGrad)" stroke="#1E1B4B" stroke-width="0.8" stroke-linejoin="round"/>
</svg>
